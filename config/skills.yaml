# Skill taxonomy used for resume and job-description matching.
#
# Each skill has a canonical id, a display name, a category and the surface forms that count as a mention.
#   aliases         – plain strings; matched case-insensitively with technical word boundaries
#                     (a boundary is anything that is not a letter, digit, "_", "+" or "#").
#   patterns        – raw regular expressions for forms that need lookarounds (e.g. Java vs JavaScript).
#   case_sensitive  – match aliases/patterns case-sensitively (needed for "Go", "C", "R", "ML").
#   ambiguous       – the surface form has common non-technical meanings; mentions are reported with
#                     lower extraction confidence.
#   implies         – evidence for this skill is *partial* evidence for the listed skills
#                     (e.g. PostgreSQL experience partially supports a generic "SQL" requirement).
#                     Implication is never treated as full support.
#   distinct_from   – documentation of near-collisions that must NOT be merged; covered by tests.
#
# Edit freely; ids must stay stable once resumes have been parsed (re-parse after renaming).

skills:
  # ---------------- Languages ----------------
  - id: python
    name: Python
    category: language
    aliases: [python, python3]
  - id: java
    name: Java
    category: language
    patterns: ['(?i)(?<![\w+#.-])java(?!\s*script)(?![\w+#])']
    distinct_from: [javascript]
  - id: javascript
    name: JavaScript
    category: language
    aliases: [javascript, ecmascript, es6]
    patterns: ['(?<![\w+#.-])JS(?![\w+#])']
    distinct_from: [java, typescript]
  - id: typescript
    name: TypeScript
    category: language
    aliases: [typescript]
    patterns: ['(?<![\w+#.-])TS(?![\w+#])']
    implies: [javascript]
  - id: go
    name: Go
    category: language
    patterns:
      - '(?i)(?<![\w+#.-])golang(?![\w+#])'
      - '(?<![\w+#.-])Go(?![\w+#-])(?!\s+(?:to|beyond|above|live|from|back|through|deep|out|into|over|with|ahead|far|for|the|a|an|on|in|by|get)\b)'
    case_sensitive: true
    ambiguous: true
  - id: rust
    name: Rust
    category: language
    aliases: [rust]
  - id: c
    name: C
    category: language
    patterns: ['(?<![\w+#./-])(?<!Series )(?<!series )C(?![\w+#])(?!\s*\+\+)(?!\s*#)(?!-level)(?!-suite)']
    case_sensitive: true
    ambiguous: true
    distinct_from: [cpp, csharp]
  - id: cpp
    name: C++
    category: language
    patterns: ['(?i)(?<![\w+#])c\+\+(?![\w+#])', '(?i)(?<![\w+#])cpp(?![\w+#])']
    distinct_from: [c, csharp]
  - id: csharp
    name: C#
    category: language
    patterns: ['(?i)(?<![\w+#])c#(?![\w+#])', '(?i)(?<![\w+#])c\s?sharp(?![\w+#])']
    distinct_from: [c, cpp]
  - id: kotlin
    name: Kotlin
    category: language
    aliases: [kotlin]
  - id: scala
    name: Scala
    category: language
    aliases: [scala]
  - id: swift
    name: Swift
    category: language
    patterns: ['(?<![\w+#.-])Swift(?![\w+#])(?! payments)(?! code)']
    case_sensitive: true
    ambiguous: true
  - id: ruby
    name: Ruby
    category: language
    aliases: [ruby]
  - id: php
    name: PHP
    category: language
    aliases: [php]
  - id: r_lang
    name: R
    category: language
    patterns: ['(?<![\w+#./-])R(?![\w+#&/-])(?=\s*(?:,|;|/|\)|and\b|or\b|programming|language|$))']
    case_sensitive: true
    ambiguous: true
  - id: sql
    name: SQL
    category: language
    aliases: [sql]
    patterns: ['(?i)(?<![\w+#])t-sql(?![\w+#])']
    distinct_from: [nosql]
  - id: bash
    name: Bash / shell scripting
    category: language
    aliases: [bash, shell scripting, shell scripts, zsh]
  - id: matlab
    name: MATLAB
    category: language
    aliases: [matlab]

