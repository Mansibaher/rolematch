name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run the offline evaluation"
        type: boolean
        default: false

permissions:
  contents: read

env:
  ROLEMATCH_TEST_DATABASE_URL: postgresql+psycopg://rolematch:rolematch@localhost:5432/rolematch_test
  ROLEMATCH_DATABASE_URL: postgresql+psycopg://rolematch:rolematch@localhost:5432/rolematch
  ROLEMATCH_EVAL_DATABASE_URL: postgresql+psycopg://rolematch:rolematch@localhost:5432/rolematch_eval

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env: { POSTGRES_USER: rolematch, POSTGRES_PASSWORD: rolematch, POSTGRES_DB: rolematch }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rolematch" --health-interval 5s --health-retries 20
    defaults:
      run: { working-directory: backend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements-dev.txt
      - name: Create test databases
        run: |
          for db in rolematch_test rolematch_eval; do
            PGPASSWORD=rolematch psql -h localhost -U rolematch -d rolematch -c "CREATE DATABASE $db"
            PGPASSWORD=rolematch psql -h localhost -U rolematch -d $db -c "CREATE EXTENSION IF NOT EXISTS vector"
          done
      - name: Lint
        run: ruff check app tests scripts
      - name: Migrations match models
        run: alembic upgrade head && alembic check
      - name: Unit and integration tests (hashing embeddings, recorded API fixtures)
        run: pytest
      - name: Cache embedding model
        uses: actions/cache@v4
        with: { path: models, key: minilm-${{ hashFiles('backend/scripts/fetch_model.py') }} }
      - name: Fetch embedding model
        run: test -f ../models/all-MiniLM-L6-v2/model.safetensors || python scripts/fetch_model.py
      - name: Embedding parity with sentence-transformers (reference implementation)
        run: pip install sentence-transformers && python scripts/verify_embedding_parity.py
      - name: Offline evaluation
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_eval }}
        run: python ../eval/run_eval.py --out ../eval/results-ci
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_eval }}
        with: { name: eval-results, path: eval/results-ci }

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run: { working-directory: frontend }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx next build
        env: { NEXT_TELEMETRY_DISABLED: "1" }

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      postgres:
        image: pgvector/pgvector:0.8.0-pg16
        env: { POSTGRES_USER: rolematch, POSTGRES_PASSWORD: rolematch, POSTGRES_DB: rolematch }
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U rolematch" --health-interval 5s --health-retries 20
    env:
      ROLEMATCH_CELERY_EAGER: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.13", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/cache@v4
        with: { path: models, key: minilm-${{ hashFiles('backend/scripts/fetch_model.py') }} }
      - name: Backend setup and demo seed
        working-directory: backend
        run: |
          pip install -r requirements.txt
          test -f ../models/all-MiniLM-L6-v2/model.safetensors || python scripts/fetch_model.py
          python -m app.cli migrate
          python -m app.cli seed
      - name: Frontend build and browsers
        working-directory: frontend
        run: |
          npm ci
          npx next build
          npx playwright install --with-deps chromium
        env: { NEXT_TELEMETRY_DISABLED: "1" }
      - name: End-to-end test
        working-directory: frontend
        run: npx playwright test
        env: { PLAYWRIGHT_START_SERVERS: "1", CI: "1" }
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-traces, path: frontend/test-results }
