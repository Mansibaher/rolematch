# Graded relevance labels for the RoleMatch offline evaluation.
#
# Authored by the system's developer from the posting text and persona resumes, BEFORE the first evaluation
# run. That is a known source of bias (the labeller knows how the system works); treat results as a sanity
# check on synthetic data, not as evidence about real job-search outcomes.
#
# Grades measure qualification fit only (eligibility, location and sponsorship are evaluated separately as
# hard-filter checks):
#   3 – strong fit: meets essentially all required qualifications at the right level
#   2 – good fit: meets most required qualifications; minor gaps
#   1 – stretch: relevant domain but notable gaps or a clear level mismatch
#   0 – not a fit: different domain/stack, or a requirement the persona plainly cannot meet
#       (e.g. "currently enrolled" for a graduate)
# Unlisted jobs are grade 0.
#
# Splits: each job in fixtures/jobs/synthetic_jobs.json carries "split": tune | heldout. Weight or rule
# changes may only be motivated by the tune split; the held-out split is reported once.
#
# Known leakage: during development the author inspected the demo persona's (jordan) ranking over all 36 jobs
# and fixed two extraction bugs because of it (domain-aware experience years; sentence splitting). The other
# four personas were written after those fixes.

